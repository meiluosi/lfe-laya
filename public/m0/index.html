<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LFE · 算法运行记录</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1917;color:#dce9df;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{max-width:1150px;margin:auto;padding:30px 24px}header,.row,.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between;border-bottom:1px solid #31483f;padding-bottom:20px}a{color:#b6d3aa;text-decoration:none}.tag,small{font-size:12px;color:#a5bcad}h1{font-weight:450;font-size:28px}button,select{font:inherit;padding:8px 13px;color:#dce9df;border:1px solid #405d50;border-radius:6px;background:#193129;cursor:pointer}button[aria-pressed=true]{background:#b9d1a1;color:#17321f}button:disabled{opacity:.4;cursor:default}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px;margin:22px 0}.water{border:1px solid #3c574b;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at top,#2b4b3b,#102622)}canvas{width:100%;height:440px;display:block}.controls{padding:15px}.controls input{flex:1;min-width:100px;accent-color:#c1d4a3}.panel{padding:22px;border:1px solid #334f41;border-radius:14px;background:#142820}.panel h2{font-weight:450;font-size:18px}.value{font-size:30px;margin:10px 0}.events{line-height:1.9;color:#aac3b3;min-height:90px}progress{width:100%;accent-color:#b9d1a1}.note{font-size:12px;color:#94ac9d;line-height:1.7}.details{margin-top:24px}summary{cursor:pointer;color:#b6d3aa}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;max-height:300px;overflow:auto;background:#10241d;padding:16px;border-radius:8px}.shapes{margin-top:22px}.error{color:#ebc3a2}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #d4e3b9;outline-offset:3px}@media(max-width:760px){main{padding:20px 14px}.layout{grid-template-columns:1fr}canvas{height:340px}.panel{padding:18px}.value{font-size:24px}}
</style></head><body><main><header><a href="/">← 观察室</a><span class="tag">真实运行记录 · 只读回放 · 不训练</span></header><h1>看看算法实际做了什么。</h1><div class="row"><label for="trajectory">运行</label><select id="trajectory" aria-label="选择运行"></select><span id="kind" class="tag"></span></div><div id="error" class="error" role="alert"></div><div class="layout"><section class="water"><canvas id="world" role="img" aria-label="资源任务的真实记录画面"></canvas><div class="controls"><button id="play">播放</button><button id="prev" aria-label="上一条记录">←</button><button id="next" aria-label="下一条记录">→</button><input id="time" type="range" min="0" value="0" aria-label="记录时间"><span id="tick"></span></div></section><aside class="panel"><small>实际执行</small><h2 id="action">加载中</h2><div class="value" id="energy">—</div><progress id="bar" max="40" value="0" aria-label="体内能量"></progress><p id="events" class="events"></p><small id="version"></small><div class="shapes"><p class="note">显示外形 · 不改变记录</p><div class="row" role="group" aria-label="显示外形"><button data-shape="blob" aria-pressed="true">柔团</button><button data-shape="dart" aria-pressed="false">尾游</button><button data-shape="ribbon" aria-pressed="false">节虫</button></div></div></aside></div><p id="boundary" class="note"></p><details class="details"><summary>查看这一步的依据</summary><pre id="evidence"></pre></details><p id="source" class="note"></p></main>
<script>
const $=s=>document.querySelector(s),names={north:'向北移动',east:'向东移动',south:'向南移动',west:'向西移动',eat:'摄食',rest:'停留'},modes={'rule':'规则','fixed-current':'固定 Laya · 当前观测','fixed-memory':'固定 Laya · 有记忆','B':'Laya + 个体学习','no-laya':'无 Laya 小网络','frozen-B':'冻结小策略'};
let data,run,index=0,shape='blob',playing=false,last=0;
function deepFreeze(value){if(value&&typeof value==='object'){Object.freeze(value);Object.values(value).forEach(deepFreeze)}return value}
function ellipse(c,x,y,rx,ry,fill,stroke){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.stroke()}}
function draw(){if(!run)return;const f=run.frames[index],w=f.world,canvas=$('#world'),rect=canvas.getBoundingClientRect(),dpr=devicePixelRatio;canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);const size=Math.min(rect.width-40,rect.height-40),cell=size/w.size,left=(rect.width-size)/2,top=(rect.height-size)/2;c.strokeStyle='#9abfa612';c.lineWidth=1;for(let i=0;i<=w.size;i++){c.beginPath();c.moveTo(left+i*cell,top);c.lineTo(left+i*cell,top+size);c.moveTo(left,top+i*cell);c.lineTo(left+size,top+i*cell);c.stroke()}w.food.forEach((food,i)=>{if(food<=0)return;const x=left+(i%w.size+.5)*cell,y=top+(Math.floor(i/w.size)+.5)*cell;ellipse(c,x,y,Math.min(10,3+food/5),Math.min(10,3+food/5),'#c9d19866','#d8dca288')});c.save();c.translate(left+(w.x+.5)*cell,top+(w.y+.5)*cell);c.scale(cell/45,cell/45);c.globalAlpha=f.terminated ? 0.35 : 1;const angle={north:-Math.PI/2,east:0,south:Math.PI/2,west:Math.PI}[f.action]||0;c.rotate(angle);c.lineWidth=1.4;if(shape==='blob'){c.beginPath();for(let i=0;i<=40;i++){let a=i/40*Math.PI*2,r=16+Math.sin(a*3)*2;i?c.lineTo(Math.cos(a)*r,Math.sin(a)*r):c.moveTo(Math.cos(a)*r,Math.sin(a)*r)}c.fillStyle='#bad49e55';c.fill();c.strokeStyle='#c8e1ad';c.stroke();ellipse(c,-2,1,6,6,'#b7d48b99')}else if(shape==='dart'){c.beginPath();c.moveTo(19,0);c.bezierCurveTo(4,-18,-18,-12,-18,0);c.bezierCurveTo(-18,12,4,18,19,0);c.fillStyle='#9bd6cb44';c.fill();c.strokeStyle='#abdcd3';c.stroke();for(let y of [-3,3]){c.beginPath();c.moveTo(-16,y);c.quadraticCurveTo(-23,y+5,-30,y-3);c.stroke()}ellipse(c,2,0,6,5,'#a9d4ce88')}else{for(let i=4;i>=0;i--)ellipse(c,14-i*7,Math.sin(i)*2,8-i*.7,7-i*.6,'#c3a9d555','#d2b7dfaa')}c.restore()}
function render(){if(!run)return;const f=run.frames[index];$('#time').value=index;$('#tick').textContent=`${f.tick} 步`;$('#action').textContent=names[f.action];$('#energy').textContent=`${f.world.energy.toFixed(1)} / ${f.world.capacity}`;$('#bar').max=f.world.capacity;$('#bar').value=f.world.energy;$('#version').textContent=f.revision==null?'固定策略':`行动时策略版本 v${f.revision}`;$('#events').textContent=f.events.map(e=>e.kind==='ate'?`摄入 ${e.amount.toFixed(2)} 能量`:e.kind==='spent'?`消耗 ${e.amount.toFixed(2)} 能量`:e.kind==='supplied'?`环境补给 ${e.amount.toFixed(1)}`:e.kind==='died'?'个体死亡':'位置已改变').join(' · ');if(f.truncated)$('#events').textContent+=' · 到达实验时长';$('#prev').disabled=index===0;$('#next').disabled=index===run.frames.length-1;$('#play').textContent=playing?'暂停':'播放';$('#evidence').textContent=JSON.stringify({provider:f.provider,reward:f.reward,model_input:f.model?.input,model_output:f.model?.raw_output,final_distribution:f.final_distribution},null,2);draw()}
$('#trajectory').onchange=()=>{run=data.runs.find(r=>r.id==$('#trajectory').value);index=0;playing=false;$('#time').max=run.frames.length-1;render()};$('#time').oninput=e=>{index=Number(e.target.value);playing=false;render()};$('#prev').onclick=()=>{index=Math.max(0,index-1);playing=false;render()};$('#next').onclick=()=>{index=Math.min(run.frames.length-1,index+1);playing=false;render()};$('#play').onclick=()=>{if(!run)return;if(index===run.frames.length-1)index=0;playing=!playing;last=performance.now();render()};document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{shape=b.dataset.shape;document.querySelectorAll('[data-shape]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw()});new ResizeObserver(draw).observe($('#world'));
function animate(t){if(playing&&t-last>450){last=t;index=Math.min(index+1,run.frames.length-1);if(index===run.frames.length-1)playing=false;render()}requestAnimationFrame(animate)}requestAnimationFrame(animate);
fetch('./latest.json').then(r=>{if(!r.ok)throw Error('记录尚未导出');return r.json()}).then(value=>{data=deepFreeze(value);for(const r of data.runs){const o=document.createElement('option');o.value=r.id;o.textContent=`${modes[r.mode]} · ${r.stage==='online'?'连续运行':'冻结评估'} · 种子 ${r.seed}`;$('#trajectory').append(o)}const chosen=data.runs.find(r=>r.mode==='B'&&r.stage==='online')||data.runs[0];$('#trajectory').value=chosen.id;$('#kind').textContent=data.pilot?'开发试跑':'预定对照';$('#boundary').textContent=data.pilot?'这是短程开发试跑，用于检查数据与学习链路，不能据此判断学习收益。':'完整结果包含失败与死亡；查看对照报告判断是否有学习收益。这里播放已有记录，不进行现场推理或训练。';$('#source').textContent=`来源：${data.source} · ${data.model.repo} · ${data.model.revision.slice(0,12)}`;$('#trajectory').onchange()}).catch(e=>{$('#error').textContent=e.message;$('#play').disabled=true;$('#next').disabled=true;$('#prev').disabled=true});
</script></body></html>
