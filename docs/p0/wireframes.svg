<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990"><rect width="1200" height="990" fill="#f4f5f1"/><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#334238} .title{font-size:18px;font-weight:600}.body{font-size:14px}</style><text x="35" y="40" class="title">LFE / P0 信息架构线框 · 2026-09-29</text><text x="35" y="68" class="body">交互原型，仅含示例；这张线框描述布局与流程，不表示模拟或学习已实现。</text><rect x="35" y="100" width="550" height="260" rx="8" fill="white" stroke="#9aa899"/><text x="55" y="130" class="title">01 / 开始与预设</text><rect x="53" y="147" width="514" height="37" rx="3" fill="#edf0e9" stroke="#bac4b6"/><text x="65" y="171" class="body">品牌 / 交互原型标识</text><rect x="53" y="195" width="514" height="37" rx="3" fill="#e3e8df" stroke="#bac4b6"/><text x="65" y="219" class="body">世界简介：观察经历与改变</text><rect x="53" y="243" width="514" height="37" rx="3" fill="#edf0e9" stroke="#bac4b6"/><text x="65" y="267" class="body">推荐场景 | 无经历场景</text><rect x="53" y="291" width="514" height="37" rx="3" fill="#e0e7d9" stroke="#bac4b6"/><text x="65" y="315" class="body">进入观察室 →</text><rect x="615" y="100" width="550" height="260" rx="8" fill="white" stroke="#9aa899"/><text x="635" y="130" class="title">02 / 世界工作台</text><rect x="633" y="147" width="514" height="37" rx="3" fill="#edf0e9" stroke="#bac4b6"/><text x="645" y="171" class="body">状态 / 暂停 / 单步 / 倍速</text><rect x="633" y="195" width="514" height="37" rx="3" fill="#e3e8df" stroke="#bac4b6"/><text x="645" y="219" class="body">中央生态画布：选择、缩放、拖动</text><rect x="633" y="243" width="514" height="37" rx="3" fill="#edf0e9" stroke="#bac4b6"/><text x="645" y="267" class="body">生命数量 / 模式 / 营养图层</text><rect x="633" y="291" width="514" height="37" rx="3" fill="#e0e7d9" stroke="#bac4b6"/><text x="645" y="315" class="body">四段经历：明确标记演示跳转</text><rect x="35" y="385" width="550" height="260" rx="8" fill="white" stroke="#9aa899"/><text x="55" y="415" class="title">03 / 生命档案</text><rect x="53" y="432" width="514" height="37" rx="3" fill="#edf0e9" stroke="#bac4b6"/><text x="65" y="456" class="body">生命 ID / 存活状态 / 跟随</text><rect x="53" y="480" width="514" height="37" rx="3" fill="#e3e8df" stroke="#bac4b6"/><text x="65" y="504" class="body">能量 / 性状 / 地点记忆 / 版本</text><rect x="53" y="528" width="514" height="37" rx="3" fill="#edf0e9" stroke="#bac4b6"/><text x="65" y="552" class="body">最近经历 → 成长视图</text><rect x="53" y="576" width="514" height="37" rx="3" fill="#e0e7d9" stroke="#bac4b6"/><text x="65" y="600" class="body">参数学习开关 ≠ 世界暂停</text><rect x="615" y="385" width="550" height="260" rx="8" fill="white" stroke="#9aa899"/><text x="635" y="415" class="title">04 / 成长视图</text><rect x="633" y="432" width="514" height="37" rx="3" fill="#edf0e9" stroke="#bac4b6"/><text x="645" y="456" class="body">个体与示例标识 / 关闭</text><rect x="633" y="480" width="514" height="37" rx="3" fill="#e3e8df" stroke="#bac4b6"/><text x="645" y="504" class="body">经历列表 | 建议 → 选择 → 后果</text><rect x="633" y="528" width="514" height="37" rx="3" fill="#edf0e9" stroke="#bac4b6"/><text x="645" y="552" class="body">策略前后：同一观测的候选分布</text><rect x="633" y="576" width="514" height="37" rx="3" fill="#e0e7d9" stroke="#bac4b6"/><text x="645" y="600" class="body">比较改变是否有用 →</text><rect x="35" y="670" width="550" height="260" rx="8" fill="white" stroke="#9aa899"/><text x="55" y="700" class="title">05 / 环境干预</text><rect x="53" y="717" width="514" height="37" rx="3" fill="#edf0e9" stroke="#bac4b6"/><text x="65" y="741" class="body">工具：营养 / 障碍</text><rect x="53" y="765" width="514" height="37" rx="3" fill="#e3e8df" stroke="#bac4b6"/><text x="65" y="789" class="body">画布点击 → 草稿点位预览</text><rect x="53" y="813" width="514" height="37" rx="3" fill="#edf0e9" stroke="#bac4b6"/><text x="65" y="837" class="body">取消草稿 | 应用到示例</text><rect x="53" y="861" width="514" height="37" rx="3" fill="#e0e7d9" stroke="#bac4b6"/><text x="65" y="885" class="body">应用反馈；重置恢复初始状态</text><rect x="615" y="670" width="550" height="260" rx="8" fill="white" stroke="#9aa899"/><text x="635" y="700" class="title">06 / 实验对照</text><rect x="633" y="717" width="514" height="37" rx="3" fill="#edf0e9" stroke="#bac4b6"/><text x="645" y="741" class="body">同一起点 / 共同条件 / 参数差异</text><rect x="633" y="765" width="514" height="37" rx="3" fill="#e3e8df" stroke="#bac4b6"/><text x="645" y="789" class="body">创建示例对照 → 两条曲线</text><rect x="633" y="813" width="514" height="37" rx="3" fill="#edf0e9" stroke="#bac4b6"/><text x="645" y="837" class="body">完整数值 / 没有改善证据</text><rect x="633" y="861" width="514" height="37" rx="3" fill="#e0e7d9" stroke="#bac4b6"/><text x="645" y="885" class="body">返回世界 / 未执行真实实验</text><text x="35" y="974" class="body">状态支路：未选择 / 无经历 / 等待 / 暂停 / 冻结 / 失败与显式降级 / 死亡 / 灭绝 / 存档受限</text></svg>